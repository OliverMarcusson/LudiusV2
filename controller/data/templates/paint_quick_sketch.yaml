task: paint_quick_sketch
app: paint
processes: [mspaint.exe]
writes: ['Pictures\{file_name}.png']
params: [file_name, caption]
about: "Make a quick sketch in Paint (a text caption) and save it as .png in Pictures. file_name: without extension; caption: one short line of text on the image (ASCII)."
defaults: {launch_query: paint, run_query: mspaint}
example: {file_name: admission test sketch, caption: room 2 layout}
variants:
  - [open_from_start, add_caption, save_shortcut, open_pictures, name_file, confirm_save, close_app]
  - [open_from_run, add_caption, save_menu, open_pictures, name_file, confirm_save, close_app]
  - [open_from_start, add_caption, save_menu, open_pictures, name_file, confirm_save, close_app]
  - [open_from_run, add_caption, save_shortcut, open_pictures, name_file, confirm_save, close_app]
weights: [1, 0.05, 1, 0.05]
budget_steps: 40
budget_minutes: 8
on_abandon: close_without_saving
subgoals:
  open_from_start:
    goal: "Open Paint by searching for it in the Start menu"
    launch: true
    keys: [Win]
    text: launch_query
    done: {foreground: {process: mspaint.exe}}
  open_from_run:
    goal: "Open Paint through the Run dialog (Win+R)"
    launch: true
    keys: [Win+R]
    text: run_query
    done: {foreground: {process: mspaint.exe}}
  add_caption:
    goal: "Click the Text tool (A) on the Home tab, click an empty spot on the canvas and type: {caption}"
    text: caption
    done: {typed: true}
  save_shortcut:
    goal: "Open the Save As dialog with the keyboard shortcut"
    keys: [Ctrl+S]
    done: {window: {process: mspaint.exe, title: "^Save As$"}}
  save_menu:
    goal: "Open the Save As dialog from Paint's File menu"
    done: {window: {process: mspaint.exe, title: "^Save As$"}}
  open_pictures:
    goal: "In the Save As dialog, open the Pictures folder"
    done: {element: {role: list item, name: "^Saved Pictures$"}}
  name_file:
    goal: "Enter {file_name} as the file name in the Save As dialog"
    text: file_name
    replace: true
    done: {typed: true, element: {name: "^File name", value: '^{file_name}(\.png)?$'}}
  confirm_save:
    goal: "Save the picture as {file_name}"
    keys: [Enter]
    done: {window: {process: mspaint.exe, title: '^{file_name}(\.png)? - Paint$'}}
  close_app:
    goal: "Close Paint"
    done: {window: {process: mspaint.exe, absent: true}}
