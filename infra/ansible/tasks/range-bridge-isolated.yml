---
# Nothing routes into or out of the range bridge, IPv4 or IPv6. The drops live in mangle FORWARD, which runs
# before filter: Tailscale inserts `-j ts-forward` (accepting -o tailscale0) at the top of filter FORWARD, so
# filter-table drops can be overtaken. Same-bridge traffic is not routed (bridge-nf-call-iptables is 0).
- name: Range bridge drops are the first rules of mangle FORWARD, IPv4 and IPv6, read back
  ansible.builtin.shell: |
    set -euo pipefail
    # both drops in the leading run of DROP rules (the drops of another range bridge may sit there too)
    lead() { $1 -t mangle -S FORWARD | sed 1d | awk '!/ -j DROP$/ {exit} {print}' | grep -cxE -e '-A FORWARD -(i|o) {{ range_bridge }} -j DROP' || true; }
    for t in iptables ip6tables; do
      if [ "$(lead $t)" != 2 ]; then
        for d in -i -o; do while $t -t mangle -D FORWARD $d {{ range_bridge }} -j DROP 2>/dev/null; do :; done; done
        $t -t mangle -I FORWARD 1 -o {{ range_bridge }} -j DROP
        $t -t mangle -I FORWARD 1 -i {{ range_bridge }} -j DROP
        echo changed
      fi
      if [ "$(lead $t)" != 2 ]; then
        echo "$t mangle FORWARD does not start with the {{ range_bridge }} drops" >&2; exit 1
      fi
    done
  args:
    executable: /bin/bash
  register: bridge_iso
  changed_when: "'changed' in bridge_iso.stdout"
