task: explorer_rename_move
app: explorer
capability: file.move
processes: [explorer.exe]
writes: ['Documents\{folder_name}\{new_name}.{file_ext}']
removes: ['Documents\{file_name}.{file_ext}', 'Documents\{new_name}.{file_ext}']
params: [file_name, file_ext, new_name, folder_name]
about: "Rename one of the persona's own files in Documents (under Own recent files) and move it into an existing folder there with Cut and Paste. file_name: the file's current name exactly, without folder and extension; file_ext: its extension without the dot; new_name: its new name without extension; folder_name: an existing folder in Documents."
example: {file_name: admission test note, file_ext: txt, new_name: admission test note old, folder_name: admission test folder}
variants:
  - [open_explorer_keys, go_documents, rename_keys, move_keys, close_explorer]
  - [open_explorer_taskbar, go_documents, rename_keys, move_menu, close_explorer]
budget_steps: 40
budget_minutes: 7
subgoals:
  open_explorer_keys:
    goal: "Open File Explorer with Win+E"
    launch: true
    keys: [Win+E]
    done: {foreground: {process: explorer.exe, class_name: CabinetWClass}}
  open_explorer_taskbar:
    goal: "Open File Explorer from its taskbar button"
    launch: true
    done: {foreground: {process: explorer.exe, class_name: CabinetWClass}}
  go_documents:
    goal: "Go to the Documents folder"
    done: {ask: "Does File Explorer show the user's own Documents folder (This PC > Documents or pinned Documents), not a library, Public Documents or another folder?"}
  rename_keys:
    goal: "Select the file {file_name}, press F2, type {new_name} and press Enter"
    text: new_name
    keys: [F2, Enter]
    done: {ask: "In the user's own Documents folder, is the renamed file \"{new_name}\" shown as a normal file item (its extension may be hidden), with rename editing finished?"}
  rename_menu:
    goal: "Right-click the file {file_name}, choose Rename, type {new_name} and press Enter"
    text: new_name
    keys: [Enter]
    done: {ask: "In the user's own Documents folder, is the renamed file \"{new_name}\" shown as a normal file item (its extension may be hidden), with rename editing finished?"}
  move_keys:
    goal: "Cut the file {new_name} with Ctrl+X, open the folder {folder_name} and paste it there with Ctrl+V"
    keys: [Ctrl+X, Ctrl+V]
    steps: 14
    done: {file: {path: 'Documents\{folder_name}\{new_name}.{file_ext}', moved_from: 'Documents\{file_name}.{file_ext}'}}
  move_menu:
    goal: "Select the file {new_name}, open its context menu with Shift+F10 and choose Cut, open the folder {folder_name}, then press Shift+F10 there and choose Paste"
    keys: [Shift+F10]
    steps: 14
    done: {file: {path: 'Documents\{folder_name}\{new_name}.{file_ext}', moved_from: 'Documents\{file_name}.{file_ext}'}}
  close_explorer:
    goal: "Close File Explorer"
    done: {window: {process: explorer.exe, class_name: CabinetWClass, absent: true}}
