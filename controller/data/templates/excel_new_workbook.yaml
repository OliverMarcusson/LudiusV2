# Make a small new workbook in Excel (classic desktop, Microsoft 365) and save it in Documents as .xlsx.
# Writes one new file, Documents\{file_name}.xlsx (a noise folder), declared by confirm_save's file check: the runner
# refuses to start if it exists, so the task never overwrites. Nothing it does is irreversible; on abandon Excel is
# closed with Don't Save. Done is read on the guest's disk, not in the UI: the saved workbook's only sheet holds
# exactly {rows} from A1 (ludius.guestfile).
# Variants cover launch method (Start search vs Run) and how the blank workbook is opened (Enter on the focused
# Blank workbook tile vs a click on it). Save is F12: Ctrl+S on a new workbook opens the Backstage first.
task: excel_new_workbook
app: excel
processes: [excel.exe]
params: [file_name, rows]
about: "Make a small new spreadsheet in Excel and save it to Documents. file_name: without extension; rows: 1-8 lines of 1-5 cells separated by a tab character (row 1 is usually headers), each cell a short ASCII text starting with a letter or a whole number, no empty cells, no dates, times, decimals or percentages."
defaults: {launch_query: excel}
example: {file_name: admission test sheet, rows: "item\tcount\npens\t12\npads\t3"}
variants:
  - [open_from_start, new_blank_enter, write_rows, save_as, name_file, confirm_save, close_app]
  - [open_from_run, new_blank_click, write_rows, save_as, name_file, confirm_save, close_app]
budget_steps: 40
budget_minutes: 8
on_abandon: close_without_saving
subgoals:
  open_from_start:
    goal: "Open Excel by searching for it in the Start menu"
    launch: true
    keys: [Win]
    text: launch_query
    done: {foreground: {process: excel.exe}}
  open_from_run:
    goal: "Open Excel through the Run dialog (Win+R)"
    launch: true
    keys: [Win+R]
    text: launch_query
    done: {foreground: {process: excel.exe}}
  new_blank_enter:
    goal: "Open a new blank workbook: the Blank workbook tile on Excel's start screen has the focus, press Enter"
    done: {foreground: {process: excel.exe, title: '^Book\d+ - Excel$'}}
  new_blank_click:
    goal: "Open a new blank workbook with a click on Blank workbook on Excel's start screen"
    done: {foreground: {process: excel.exe, title: '^Book\d+ - Excel$'}}
  write_rows:
    goal: "Cell A1 of the new sheet is selected: type the rows at the keyboard focus (the text moves to the next cell on Tab and to the next row on Enter)"
    text: rows_enter
    # Into the grid only: never a ribbon field (Font, Name Box, Formula Bar, search), never a cell other than A1.
    avoid:
      - {role: edit}
      - {role: combo box}
      - {role: data item, name: '^(?!A1$)'}
    done: {typed: true}
  save_as:
    goal: "Open the Save As dialog with F12"
    keys: [F12]
    done: {window: {process: excel.exe, title: "^Save As$"}}
  name_file:
    goal: "Enter {file_name} as the file name in the Save As dialog"
    text: file_name
    done: {typed: true, element: {name: "^File name", value: '^{file_name}(\.xlsx)?$'}}
  confirm_save:
    goal: "Save the workbook as {file_name}"
    done:
      window: {process: excel.exe, title: '^{file_name}(\.xlsx)? - Excel$'}
      file: {path: 'Documents\{file_name}.xlsx', cells: "{rows}"}
  close_app:
    goal: "Close Excel"
    done: {window: {process: excel.exe, absent: true}}
