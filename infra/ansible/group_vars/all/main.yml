  {{ [[srv01_vmid | int, 'ludius-srv01']] if mail_backend == 'grommunio'
     else [[srv01_vmid | int, 'ludius-dc01'], [ex01_vmid | int, 'ludius-ex01'], [chat01_vmid | int, 'ludius-chat01']] }}
