task: outlook_send_invite
app: outlook
capability: calendar.invite
params: [to, to_name, subject, date, start, end, body]
about: "Invite one colleague to a meeting in Outlook and send the invite. to: the colleague's address <user>@ludius.internal; subject: one line; date: YYYY-MM-DD, a weekday within the next two weeks after the plan's day; start and end: HH:MM between 08:00 and 17:00, 15-120 minutes apart; body: optional short agenda (ASCII, a few short lines) or empty."
defaults: {body: ""}
example: {to: mvellinga@ludius.internal, to_name: Marcus Vellinga, subject: lund accruals q4 review, date: "2026-11-05", start: "10:30", end: "11:15", body: "walk through the lund accruals before the close\n- anna"}
variants:
  - [open_outlook, new_meeting_shortcut, fill_to, fill_subject, fill_date, fill_start, fill_end, write_body, send_shortcut, close_outlook]
  - [open_outlook, new_meeting_menu, fill_to, fill_subject, fill_date, fill_start, fill_end, write_body, send_shortcut, close_outlook]
budget_steps: 40
budget_minutes: 8
on_abandon: close_without_saving
subgoals:
  open_outlook:
    goal: "Open Outlook by searching for it in the Start menu"
    launch: true
    keys: [Win]
    text: launch_query
    steps: 8
    done: {foreground: {process: outlook.exe, title: " - Outlook$"}}
  new_meeting_shortcut:
    goal: "Start a new meeting with Ctrl+Shift+Q"
    keys: [Ctrl+Shift+Q]
    avoid: [{name: "^(New Meeting|New Items|Calendar)$"}]
    done: {window: {process: outlook.exe, title: "^Untitled - Meeting"}}
  new_meeting_menu:
    goal: "Start a new meeting from the New Items menu on the Home tab (New Items, then Meeting)"
    done: {window: {process: outlook.exe, title: "^Untitled - Meeting"}}
  fill_to:
    goal: "Type {to} into the Required field of the new meeting"
    text: to
    done: {ask: "Is {to_name} ({to}) listed in the Required attendees of the open meeting?"}
  fill_subject:
    goal: "Type the meeting title into the Title field: {subject}"
    text: subject
    done: {element: {role: edit, name: "^Title$", value: "^{subject}$"}}
  fill_date:
    goal: "Replace the Start date with {date_ui}"
    text: date_ui
    replace: true
    done: {element: {role: edit, name: "^Start date, combo$", value: '^(\w{{3}} )?{date_ui}$'}}
  fill_start:
    goal: "Replace the Start time with {start}"
    text: start
    replace: true
    done: {element: {role: edit, name: "^Start time, combo$", value: "^{start}$"}}
  fill_end:
    goal: "Replace the End time with {end}"
    text: end
    replace: true
    done: {element: {role: edit, name: "^End time, combo$", value: "^{end}$"}}
  write_body:
    goal: "Type the agenda into the meeting's message body (below the times)"
    text: body
    unreadable_ok: true
    done: {typed: true}
  send_shortcut:
    goal: "Send the meeting invitation with Alt+S"
    keys: [send]
    allow_destructive: ["Send"]
    require:
      - {role: edit, name: "^Title$", value: "^{subject}$"}
      - {role: edit, name: "^Start date, combo$", value: '^\w{{3}} {date_ui}$'}
      - {role: edit, name: "^Start time, combo$", value: "^{start}$"}
      - {role: edit, name: "^End date, combo$", value: '^\w{{3}} {date_ui}$'}
      - {role: edit, name: "^End time, combo$", value: "^{end}$"}
    done: {invite: {}}
  close_outlook:
    goal: "Close Outlook"
    done: {window: {process: outlook.exe, absent: true}}
