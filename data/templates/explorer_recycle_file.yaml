task: explorer_recycle_file
app: explorer
capability: file.recycle
processes: [explorer.exe]
removes: ['Documents\{file_name}.{file_ext}']
params: [file_name, file_ext]
about: "Move one of the persona's own old files in Documents (under Own recent files, written at least 3 days ago and not used today) to the Recycle Bin, like clearing out a stale draft. file_name: the file's name exactly, without folder and extension; file_ext: its extension without the dot (docx, xlsx, pptx, txt or rtf)."
example: {file_name: admission test draft, file_ext: txt}
variants:
  - [open_explorer_keys, go_documents, show_extensions, select_file, recycle_keys, open_bin, close_explorer]
  - [open_explorer_taskbar, go_documents, show_extensions, select_file, recycle_keys, open_bin, close_explorer]
weights: [1, 1]
budget_steps: 44
budget_minutes: 7
subgoals:
  open_explorer_keys:
    goal: "Open File Explorer with Win+E"
    launch: true
    keys: [Win+E]
    done: {foreground: {process: explorer.exe, class_name: CabinetWClass}}
  open_explorer_taskbar:
    goal: "Open File Explorer from its taskbar button"
    launch: true
    done: {foreground: {process: explorer.exe, class_name: CabinetWClass}}
  go_documents:
    goal: "Go to the Documents folder"
    done: {foreground: {process: explorer.exe, class_name: CabinetWClass, title: "^Documents$"}}
  show_extensions:
    goal: "Turn on File name extensions on File Explorer's View tab, so the file shows as {file_name}.{file_ext}"
    steps: 8
    avoid: [{role: edit}, {name: '(?i)^(hidden items|item check boxes|hide selected items|options)$'}]
    done: {element: {role: check box, name: '^File name extensions$', value: '^on$'}}
  select_file:
    goal: "Click the file {file_name}.{file_ext} once to select it"
    in_window: &documents {process: explorer.exe, class_name: CabinetWClass, title: "^Documents$"}
    breadcrumb: &crumbs ['This PC', Documents]
    avoid: [{role: edit}]
    done: {element: {role: list item, name: '^{file_name}\.{file_ext}$', selected: true}}
  recycle_keys:
    goal: "Press Delete to move the selected file {file_name} to the Recycle Bin"
    keys: [Delete]
    steps: 6
    in_window: *documents
    breadcrumb: *crumbs
    require: [{role: list item, name: '^{file_name}\.{file_ext}$', selected: true}]
    forbid:
      - {role: list item, name: '^(?!{file_name}\.{file_ext}$)', selected: true}
      - {name: '(?i)permanently delete'}
    avoid: [{role: edit}, {role: menu item}]
    done: {file: {path: 'Documents\{file_name}.{file_ext}', recycled: true}}
  open_bin:
    goal: "Open the Recycle Bin: click File Explorer's address bar, type Recycle Bin and press Enter"
    search: Recycle Bin
    keys: [Enter]
    steps: 10
    avoid: [{name: '(?i)^(delete|restore.*|empty recycle bin|properties|search box)$'}, {role: menu item}]
    done:
      foreground: {process: explorer.exe, class_name: CabinetWClass, title: '^Recycle Bin$'}
      element: {role: list item, name: '^{file_name}\.{file_ext}$'}
  close_explorer:
    goal: "Close File Explorer"
    done: {window: {process: explorer.exe, class_name: CabinetWClass, absent: true}}
