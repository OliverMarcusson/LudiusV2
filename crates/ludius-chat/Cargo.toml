[package]
name = "ludius-chat"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
regex = { version = "1.13.1", optional = true }
serde_json = { version = "1.0.154", optional = true }

[features]
default = ["mattermost"]
# Mattermost backend (psql and mmctl over SSH to LUDIUS_CHAT_HOST). Without a backend, chat reads are unknown.
mattermost = ["dep:regex", "dep:serde_json"]
