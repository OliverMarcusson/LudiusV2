---
- name: Debian 13
  ansible.builtin.assert:
    that: ansible_distribution == 'Debian' and ansible_distribution_major_version == '13'

- name: Hostname resolves to the public address (pve-cluster needs it)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\S+\s+{{ ansible_fqdn }}\b'
    line: "{{ ansible_default_ipv4.address }} {{ ansible_fqdn }} {{ ansible_hostname }}"

- name: Proxmox archive key
  ansible.builtin.get_url:
    url: https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
    dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
    mode: "0644"

- name: Proxmox VE repository (no-subscription)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-install-repo.sources
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: trixie
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    mode: "0644"

- name: Full upgrade
  ansible.builtin.apt:
    upgrade: full
    update_cache: true

- name: Proxmox kernel
  ansible.builtin.apt:
    name: proxmox-default-kernel

- name: Running the newest Proxmox kernel
  ansible.builtin.include_tasks: reboot-if-needed.yml

- name: Proxmox web UI on loopback before proxmox-ve is installed (first start included)
  ansible.builtin.include_tasks: pve-exposure.yml

- name: Postfix local-only (no mail leaves the box)
  ansible.builtin.debconf:
    name: postfix
    question: postfix/main_mailer_type
    value: Local only
    vtype: select

- name: Proxmox VE
  ansible.builtin.apt:
    name: [proxmox-ve, postfix, open-iscsi, chrony, dnsmasq, iptables, xorriso]

- name: Enterprise apt sources off right after the install (they break every later apt run)
  ansible.builtin.include_tasks: pve-repos.yml

- name: Proxmox web UI on loopback, SPICE proxy and rpcbind off
  ansible.builtin.include_tasks: pve-exposure.yml

- name: No Debian kernel or os-prober
  ansible.builtin.apt:
    name: [linux-image-amd64, "linux-image-6.12*", os-prober]
    state: absent
  register: debkernel

- name: Update grub
  ansible.builtin.command: update-grub
  when: debkernel is changed
  changed_when: true

- name: Still running the newest Proxmox kernel (proxmox-ve may have brought a newer one)
  ansible.builtin.include_tasks: reboot-if-needed.yml

- name: Packages the range needs on an installed node (ludius setup runs only the range-host tasks)
  tags: [range-host]
  ansible.builtin.apt:
    name: [dnsmasq, iptables, xorriso]
    update_cache: true

- name: Network config includes interfaces.d
  tags: [range-host]
  ansible.builtin.lineinfile:
    path: /etc/network/interfaces
    line: source /etc/network/interfaces.d/*

- name: Bridge list is the host's (a range vars file such as ranges/imap-test.yml would drop the main bridge)
  tags: [bridges, range-host]
  ansible.builtin.assert:
    that: range_bridge not in extra_range_bridges | map(attribute='bridge') and range_bridge != build_bridge
    fail_msg: run proxmox-host.yml without a range vars file ({{ range_bridge }} is also in extra_range_bridges or the build bridge)

- name: Our bridges are ours or free (never take over a bridge the node defines or runs elsewhere)
  tags: [bridges, range-host]
  ansible.builtin.shell: |
    set -u
    b={{ item }}
    grep -qsE "^\s*iface\s+$b(\s|$)" /etc/network/interfaces.d/ludius && exit 0
    # ifquery follows every source/source-directory line, wherever the node keeps its config
    defined=$(ifquery --list --all) || { echo "ifquery failed: can't tell which bridges the node defines"; exit 1; }
    if grep -qx "$b" <<<"$defined"; then
      echo "$b is defined in the node's network config; pick another bridge in the range spec"; exit 1
    fi
    if ip link show "$b" >/dev/null 2>&1; then echo "$b exists on the node; pick another bridge in the range spec"; exit 1; fi
    exit 0
  args:
    executable: /bin/bash
  environment:
    PATH: /usr/sbin:/usr/bin:/sbin:/bin  # ifquery is system Python, like ifreload below
  changed_when: false
  loop: "{{ [range_bridge, build_bridge] + extra_range_bridges | map(attribute='bridge') | list }}"

- name: Range and build bridges
  tags: [bridges, range-host]
  ansible.builtin.template:
    src: ludius-bridges.j2
    dest: /etc/network/interfaces.d/ludius
    mode: "0644"
  register: bridges

- name: Apply bridges
  tags: [bridges, range-host]
  ansible.builtin.command: ifreload -a
  environment:
    PATH: /usr/sbin:/usr/bin:/sbin:/bin  # ifreload is system Python; an ansible venv first on PATH breaks it
  when: bridges is changed
  changed_when: true

- name: DHCP on the build bridge only (no DNS service)
  tags: [range-host]
  ansible.builtin.copy:
    dest: /etc/dnsmasq.d/ludius-build.conf
    content: |
      port=0
      interface={{ build_bridge }}
      bind-interfaces
      dhcp-range=10.78.0.100,10.78.0.199,12h
      dhcp-option=option:router,10.78.0.1
      dhcp-option=option:dns-server,{{ build_dns }}
    mode: "0644"
  register: dnsmasq

- name: Restart dnsmasq
  tags: [range-host]
  ansible.builtin.systemd_service:
    name: dnsmasq
    enabled: true
    state: restarted
  when: dnsmasq is changed

- name: Vhost-vsock loaded now and at boot (guest channel)
  tags: [range-host]
  community.general.modprobe:
    name: vhost_vsock
    persistent: present

- name: Storage list
  tags: [range-host]
  ansible.builtin.command: pvesm status
  register: pvesm
  changed_when: false

- name: Thin pool for linked clones (only when the storage does not exist yet)
  tags: [range-host]
  ansible.builtin.command: lvcreate --type thin-pool -l {{ thin_pool_extents }} -n data {{ thin_vg }}
  args:
    creates: /dev/{{ thin_vg }}/data
  when: storage not in pvesm.stdout

- name: Lvmthin storage {{ storage }}
  tags: [range-host]
  ansible.builtin.command: pvesm add lvmthin {{ storage }} --vgname {{ thin_vg }} --thinpool data --content images,rootdir
  when: storage not in pvesm.stdout
  changed_when: true

- name: Virtio-win ISO
  tags: [range-host]
  ansible.builtin.get_url:
    url: "{{ virtio_win_iso_url }}"
    dest: /var/lib/vz/template/iso/virtio-win.iso
    mode: "0644"

- name: Virtio-win ISO with viosock (golden image, infra/packer)
  tags: [range-host]
  ansible.builtin.get_url:
    url: "{{ golden_virtio_iso_url }}"
    dest: /var/lib/vz/template/iso/{{ golden_virtio_iso_url | basename }}
    checksum: sha256:{{ golden_virtio_iso_sha256 }}
    mode: "0644"

- name: Windows ISO present
  tags: [range-host]
  ansible.builtin.stat:
    path: /var/lib/vz/template/iso/win10.iso
  register: winiso

- name: Windows ISO uploaded by the owner
  tags: [range-host]
  ansible.builtin.assert:
    that: winiso.stat.exists
    fail_msg: copy the Windows 10 ISO to /var/lib/vz/template/iso/win10.iso (scp), then rerun

- name: Range pool (the host agent's Proxmox:Pool)
  tags: [range-host]
  ansible.builtin.command: pvesh get /pools/{{ range_pool }}
  register: pool
  changed_when: false
  failed_when: false

- name: Create the range pool
  tags: [range-host]
  ansible.builtin.command: pvesh create /pools --poolid {{ range_pool }} --comment "Ludius range - the only VMs the agent and playbooks touch"
  when: pool.rc != 0
  changed_when: true

- name: Local storage content types
  tags: [range-host]
  ansible.builtin.command: pvesh get /storage/local --output-format json
  register: local_storage
  changed_when: false

- name: Snippets on local storage (srv01's cloud-init user-data), keeping its other content types
  tags: [range-host]
  vars:
    local_content: "{{ (local_storage.stdout | from_json).content.split(',') }}"
  ansible.builtin.command: pvesm set local --content {{ (local_content + ['iso', 'vztmpl', 'backup', 'snippets']) | unique | join(',') }}
  when: "'snippets' not in local_content"
  changed_when: true

- name: Packer API token
  tags: [range-host]
  ansible.builtin.shell: |
    set -eo pipefail
    umask 077
    pveum user token add root@pam packer --privsep 0 --output-format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' >/root/.ludius-packer-token
  args:
    executable: /bin/bash
    creates: /root/.ludius-packer-token
