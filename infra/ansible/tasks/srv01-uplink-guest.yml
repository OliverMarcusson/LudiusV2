---
- name: DHCP on the uplink NIC
  ansible.builtin.copy:
    dest: /etc/systemd/network/10-ludius-uplink.network
    content: |
      [Match]
      MACAddress={{ uplink_mac | default(srv01_build_mac) | lower }}

      [Network]
      DHCP=ipv4
    mode: "0644"
  when: uplink == 'present'

- name: No uplink unit
  ansible.builtin.file:
    path: /etc/systemd/network/10-ludius-uplink.network
    state: absent
  when: uplink == 'absent'

- name: Reload networkd
  ansible.builtin.command: networkctl reload
  changed_when: true

- name: Uplink interface and default route
  when: uplink == 'present'
  ansible.builtin.shell: |
    set -eo pipefail
    ip -o link | awk -v m="{{ uplink_mac | default(srv01_build_mac) | lower }}" 'tolower($0) ~ m {sub(":", "", $2); print $2; exit}'
    ip -4 route show default | grep -q .
  args:
    executable: /bin/bash
  register: uplink_if
  retries: 30
  delay: 5
  until: uplink_if.rc == 0
  changed_when: false

- name: Uplink interface for the role (Samba's DNS forwarder)
  when: uplink == 'present'
  ansible.builtin.set_fact:
    srv01_uplink_if: "{{ uplink_if.stdout_lines[0] }}"

- name: No default route and no route off the range
  when: uplink == 'absent'
  ansible.builtin.shell: |
    set -o pipefail
    test -z "$(ip -4 route show default)" && test -z "$(ip -6 route show default)" &&
      test -z "$(ip -4 route show | grep -v '^{{ range_net | regex_escape }}\.0/24 ')"
  args:
    executable: /bin/bash
  register: routes
  retries: 12
  delay: 5
  until: routes.rc == 0
  changed_when: false
