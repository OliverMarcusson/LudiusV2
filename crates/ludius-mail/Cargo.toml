[package]
name = "ludius-mail"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
base64 = { version = "0.23.1", optional = true }
chrono = { version = "0.4", optional = true }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"], optional = true }
roxmltree = { version = "0.20", optional = true }
sha2 = { version = "0.10", optional = true }

[features]
default = ["ews"]
# Exchange Web Services backend (impersonation). Without a backend, mail checks read as unknown.
ews = ["dep:base64", "dep:chrono", "dep:reqwest", "dep:roxmltree", "dep:sha2"]
