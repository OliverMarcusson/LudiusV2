# Capability catalog for template growth (spec section 6): what is installed on the image and what a
# person does with it. The planner LLM proposes templates from this; only admitted ones reach plans.
apps:
  - name: notepad
    process: notepad.exe
    start_query: notepad
    features: [write plain text, open a recent file, find and replace, save as, word wrap, print preview]
  - name: wordpad
    process: wordpad.exe
    start_query: wordpad
    features: [write a short document, bold and bullet formatting, change font size, save as .rtf or .docx, insert date and time]
  - name: paint
    process: mspaint.exe
    start_query: paint
    features: [draw shapes, add text, resize an image, crop, save as .png]
  - name: explorer
    process: explorer.exe
    window_class: CabinetWClass
    start_query: file explorer
    features: [create folders, rename files, move files between folders, sort and change view, search in a folder, open a file]
  - name: powershell
    process: powershell.exe
    start_query: powershell
    features: [read-only admin checks (services, local group members, disk space), IT admin personas only]
  - name: edge
    process: msedge.exe
    start_query: edge
    features: [web search, open a result, open a site by address, add a favorite, download a public document, read a page]
  - name: outlook
    process: outlook.exe
    start_query: outlook
    features: [send a mail to a colleague, reply to a mail, read the inbox, file a mail in a folder]
# Subgoal vocabulary: what a subgoal may contain (the Subgoal schema), and the code-checkable completions.
checks:
  window: "{process, title (regex), class_name, absent} - such a window exists (or not), foreground or background"
  foreground: "{process, title (regex), class_name, absent} - the foreground window matches"
  element: "{role, name (regex), value (regex)} - an element on screen matches"
  typed: "true - the subgoal's text landed in the target element"
