[project]
name = "ludius-controller"
version = "0.1.0"
description = "Ludius controller: step loop, Jev decisions, policy and templates"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.70",
    "protobuf>=5.29",
    "pydantic>=2.10",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.scripts]
ludius = "ludius.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "pyright>=1.1.390", "grpcio-tools>=1.70", "types-pyyaml", "types-protobuf"]
durable = [
    "temporalio>=1.34.0",
]
state = [
    "minio>=7.2",
    "psycopg[binary]>=3.2",
]
visual = [
    "rapidocr-onnxruntime>=1.4.4",
]

[tool.uv]
# durable (Temporal) and state (PostgreSQL) are light and typed: installed by default so CI typechecks and tests them.
default-groups = ["dev", "durable", "state"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ludius"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/ludius/v1"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["src/ludius/v1"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["service: starts a real Temporal, PostgreSQL or MinIO server; deselect with -m 'not service'"]
