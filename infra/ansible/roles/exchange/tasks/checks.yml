---
- name: As the domain's Administrator
  ansible.builtin.set_fact:
    ansible_user: "{{ domain_netbios }}\\Administrator"
    ansible_password: "{{ dc_admin_password }}"
    ansible_become_user: "{{ domain_netbios }}\\Administrator"
    ansible_become_password: "{{ dc_admin_password }}"
    ansible_become_method: runas
  no_log: true

- name: New connection as the domain's Administrator
  ansible.builtin.meta: reset_connection

- name: Range boundary and mailboxes asserted, outside probe rejected and never sent
  ansible.windows.win_powershell:
    script: |
      param($domain, $people, $svc, $marker)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn
      if (Get-SendConnector) { throw 'a send connector exists' }
      $ad = @(Get-AcceptedDomain | ForEach-Object { "$($_.DomainName)" })
      if ($ad.Count -ne 1 -or $ad[0] -ne $domain) { throw "accepted domains: $($ad -join ', ')" }
      $r = Get-TransportRule 'Ludius range only'
      if ($r.State -ne 'Enabled' -or "$($r.SentToScope)" -ne 'NotInOrganization' -or -not $r.RejectMessageReasonText) { throw 'transport rule not as set' }
      $missing = @($people | Where-Object { "$((Get-Mailbox $_ -ErrorAction SilentlyContinue).PrimarySmtpAddress)" -ne "$_@$domain" })
      if ($missing) { throw "no mailbox at <user>@$($domain): $($missing -join ', ')" }
      $grants = @(Get-ManagementRoleAssignment -RoleAssignee $svc -Role ApplicationImpersonation)
      if ($grants.Count -ne 1 -or "$($grants[0].CustomRecipientWriteScope)" -ne 'Ludius noise mailboxes' -or
          "$($grants[0].RecipientWriteScope)" -ne 'CustomRecipientScope') { throw 'impersonation not limited to the noise scope' }
      $filter = "CustomAttribute1 -eq '$marker'"
      $sc = Get-ManagementScope 'Ludius noise mailboxes'
      if ($sc.RecipientFilter -ne $filter -or $sc.RecipientRoot -or "$($sc.ScopeRestrictionType)" -ne 'RecipientScope') {
        throw "scope filter is '$($sc.RecipientFilter)' (root '$($sc.RecipientRoot)')" }
      $members = @(Get-Recipient -ResultSize Unlimited -RecipientPreviewFilter $sc.RecipientFilter | ForEach-Object SamAccountName)
      if (Compare-Object @($members | Sort-Object) @($people | Sort-Object)) { throw "scope resolves to: $($members -join ', ')" }
      $all = @(Get-ManagementRoleAssignment -RoleAssignee $svc)
      if ($all.Count -ne 1 -or "$($all[0].Role)" -ne 'ApplicationImpersonation') { throw "service account roles: $(($all | ForEach-Object Role) -join ', ')" }
      $groups = @(Get-ADPrincipalGroupMembership $svc | ForEach-Object Name)
      if ($groups.Count -ne 1 -or $groups[0] -ne 'Domain Users') { throw "service account groups: $($groups -join ', ')" }
      $outside = (Get-Mailbox -RecipientTypeDetails DiscoveryMailbox | Select-Object -First 1).PrimarySmtpAddress.ToString()
      $id = "<probe-$([guid]::NewGuid().ToString('N'))@$domain>"
      $pickup = (Get-TransportService $env:COMPUTERNAME).PickupDirectoryPath.PathName
      $eml = "From: postmaster@$domain`r`nTo: probe@example.com`r`nSubject: Ludius range boundary probe`r`nMessage-ID: $id`r`n`r`nprobe`r`n"
      [IO.File]::WriteAllText((Join-Path $pickup "ludius-probe.eml"), $eml)
      $deadline = (Get-Date).AddMinutes(5)
      do {
        Start-Sleep 10
        $ev = @(Get-MessageTrackingLog -MessageId $id -Start (Get-Date).AddMinutes(-15) -ErrorAction SilentlyContinue)
      } until (($ev.EventId -contains 'FAIL') -or (Get-Date) -gt $deadline)
      if ($ev.EventId -notcontains 'FAIL') { throw "probe not rejected: $($ev.EventId -join ',')" }
      $why = "$(($ev | Where-Object EventId -eq FAIL).RecipientStatus)"
      $rejecting = @(Get-TransportRule | Where-Object { $_.RejectMessageReasonText -or $_.RejectMessageEnhancedStatusCode })
      if ($rejecting.Count -ne 1 -or $rejecting[0].Name -ne 'Ludius range only') { throw "rejecting rules: $($rejecting.Name -join ', ')" }
      if ($why -notmatch '5\.7\.1' -or $why -notmatch 'TRANSPORT\.RULES\.RejectMessage') { throw "probe failed for another reason: $why" }
      if ($ev | Where-Object { $_.EventId -in 'SEND', 'SENDEXTERNAL' }) { throw 'probe was sent' }
      if (Get-Queue | Where-Object { $_.NextHopDomain -like '*example.com*' -and $_.MessageCount -gt 0 }) { throw 'probe queued' }
      $Ansible.Result = @{ rejected = "$(($ev | Where-Object EventId -eq FAIL | Select-Object -First 1).RecipientStatus)"; outside = $outside }
    parameters:
      domain: "{{ mail_domain }}"
      people: "{{ people | map(attribute='user') | list }}"
      svc: "{{ ews_user }}"
      marker: "{{ ews_scope_marker }}"
  become: true
  register: boundary

- name: Boundary probe result
  ansible.builtin.debug:
    var: boundary.result

- name: Range mail certificate to the control node (clients trust it, the controller verifies EWS with it)
  ansible.builtin.fetch:
    src: C:\Windows\Temp\range-mail.crt
    dest: "{{ range_tls_ca }}"
    flat: true

- name: Ex01 checked
  ansible.builtin.set_fact:
    exchange_checked: true
