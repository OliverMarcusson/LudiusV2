task: chat_read_channel
app: edge
capability: chat.read_channel
processes: [msedge.exe]
params: [channel]
about: "Check a team chat channel for new posts (a request, an answer): open the channel and read the newest. channel: the channel's name."
defaults: {app_query: edge, chat_url: chat.corp.ludius.test}
example: {channel: Operations}
variants:
  - [open_edge_start, open_chat, open_channel, read_newest, close_edge]
  - [open_edge_taskbar, open_chat, open_channel, read_newest, close_edge]
  - [open_edge_start, open_chat, open_channel, read_newest]
  - [open_edge_taskbar, open_chat, open_channel, read_newest]
  - [close_edge]
weights: [1, 1, 0, 0, 0]
key_commits: [{keys: Enter, focus: {name: "^(Write to |Reply to this thread)"}}]
budget_steps: 30
budget_minutes: 6
subgoals:
  open_edge_start:
    goal: "Open Microsoft Edge from the Start menu"
    launch: true
    keys: [Win]
    text: app_query
    done: {foreground: {process: msedge.exe}}
  open_edge_taskbar:
    goal: "Open Microsoft Edge from its taskbar button"
    launch: true
    done: {foreground: {process: msedge.exe}}
  open_chat:
    goal: "Open the team chat: go to {chat_url} in the address bar. If a sign-in page shows, click the GitLab button (it signs in with the Windows account; never type a password)"
    text: chat_url
    keys: [Ctrl+L, Enter]
    replace: true
    field: "^Address and search bar$"
    done: {ask: "Is the Mattermost team chat open and signed in, showing its list of channels?"}
  open_channel:
    goal: "Open the {channel} channel: click it in the channel list, or press Ctrl+K, type its name and press Enter"
    text: channel
    keys: [Ctrl+K, Enter]
    done: {ask: "Is the {channel} channel open in the chat, its name shown above the messages?"}
  read_newest:
    goal: "Read the newest posts in {channel}; scroll down to the end of the channel if needed"
    steps: 6
    done: {ask: "Is the {channel} channel open with posts visible in it?"}
  close_edge:
    goal: "Close Microsoft Edge"
    done: {window: {process: msedge.exe, absent: true}}
