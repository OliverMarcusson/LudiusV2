syntax = "proto3";

package ludius.v1;

option csharp_namespace = "Ludius.V1";

import "ludius/v1/observation.proto";

service HostAgent {
  rpc Input(InputRequest) returns (InputResult);
  rpc Observe(ObserveRequest) returns (ObserveResult);
  rpc Lifecycle(LifecycleRequest) returns (LifecycleResult);
  rpc Screenshot(ScreenshotRequest) returns (ScreenshotResult);
  rpc ReadGuestFile(GuestFileRequest) returns (FileContent);
  rpc Info(InfoRequest) returns (AgentInfo);
}

message InfoRequest {}

message AgentInfo {
  string backend = 1;
  string host = 2;
}

message GuestFileRequest {
  string vm = 1;
  ReadFile file = 2;
}

message Move {
  int32 x = 1;
  int32 y = 2;
  uint32 duration_ms = 3;
}

message Click {
  enum Button {
    LEFT = 0;
    RIGHT = 1;
    MIDDLE = 2;
  }
  Button button = 1;
  uint32 count = 2;
}

message Key {
  uint32 vk = 1;
  bool down = 2;
}

message Chord {
  repeated uint32 vk = 1;
}

message TypeText {
  string text = 1;
  uint32 mean_ms = 2;
  uint32 jitter_ms = 3;
}

message CtrlAltDel {}

message Scroll {
  int32 notches = 1;
}

message InputRequest {
  string vm = 1;
  oneof action {
    Move move = 2;
    Click click = 3;
    Key key = 4;
    Chord chord = 5;
    TypeText type = 6;
    CtrlAltDel ctrl_alt_del = 7;
    Scroll scroll = 8;
  }
}

message InputResult {
  int64 host_time_ms = 1;
}

message ObserveRequest {
  string vm = 1;
  SnapshotRequest request = 2;
}

message ObserveResult {
  Snapshot snapshot = 1;
  Hello hello = 2;
  int64 host_time_ms = 3;
}

message LifecycleRequest {
  string vm = 1;
  enum Op {
    START = 0;
    STOP = 1;
    CHECKPOINT = 2;
    RESTORE = 3;
    STATE = 4;
    CLONE = 5;
    DELETE = 6;
  }
  Op op = 2;
  string checkpoint = 3;
  string target = 4;
}

message LifecycleResult {
  string state = 1;
}

message ScreenshotRequest {
  string vm = 1;
}

message ScreenshotResult {
  bytes png = 1;
  int32 width = 2;
  int32 height = 3;
}
