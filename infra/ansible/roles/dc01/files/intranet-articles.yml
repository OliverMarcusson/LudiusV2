# The range intranet's pages (dc01 role, intranet.html.j2): the closed range has no web, so Edge's default search is
# this. Topics follow what the planner's personas look up (finance policy, HR, warehouse, procurement, IT, ERP).
# popular: shown on the home page and when a search matches nothing.
- id: capitalising-software
  section: Finance
  title: Capitalising software and ERP implementation costs
  owner: Group finance
  updated: "2026-10-12"
  popular: true
  tags: [RJ 210, RJ 272, Dutch GAAP, IFRS, IAS 38, intangible assets, capitalisation, capitalization, software, ERP, implementation, migration, cloud, SaaS, internally developed]
  body:
    - "Under Dutch GAAP (RJ 210 Intangible fixed assets) we capitalise internally developed software only in the development phase, when technical feasibility, the intention and ability to complete and use it, probable future economic benefits and a reliable measure of the cost are all shown. Research-phase costs are expensed."
    - "Cloud ERP: the subscription is a service, not an asset; fees are expensed over the contract. Configuration and customisation that we do not control as a separate asset (most SaaS set-up work) is expensed when the service is received. Data migration, training and parallel running are always expensed."
    - "Costs that can qualify: external developer time on interfaces we own, internal staff time booked to the build project codes, and testing before go-live. Keep timesheets per project code; without them nothing is capitalised."
    - "The policy note on the ERP finance module project is drafted by the financial controller and reviewed with the finance director before the management accounts. Questions: group finance."
- id: month-end-close
  section: Finance
  title: Month-end close checklist and timetable
  owner: Group finance
  updated: "2026-09-30"
  popular: true
  tags: [month end, close, closing, accruals, prepayments, reconciliation, workpapers, management accounts, October, timetable, journal]
  body:
    - "Working day 1: purchase ledger cut-off, goods received not invoiced accrual, payroll journal. Working day 2: bank and intercompany reconciliations, stock valuation from the warehouse count. Working day 3: accruals and prepayments review, fixed asset register, VAT control account."
    - "Working day 4: workpaper pack complete and reviewed, management accounts draft with commentary on variances over EUR 10,000 or 10%. Working day 5: final pack to the finance director."
    - "Workpapers live in the Finance share under Close\\<year>\\<month>. Every reconciliation shows the preparer, the reviewer and the date."
- id: supplier-onboarding
  section: Finance
  title: New supplier set-up (KvK, VAT and bank details)
  owner: Accounts payable
  updated: "2026-10-20"
  tags: [supplier, vendor, onboarding, KvK, Chamber of Commerce, VAT number, BTW, IBAN, bank details, verification, fraud, payables, master data]
  body:
    - "Before a supplier is created in the payables ledger, accounts payable checks the KvK extract (name, registered address, KvK number), the VAT number against the EU VIES register, and the IBAN against a letter or invoice on the supplier's letterhead."
    - "Bank detail changes are always confirmed by phone with a known contact, on a number taken from our own records, never from the email asking for the change."
    - "The procurement owner fills in the supplier request form; AP creates the account. Purchase orders are required for all new board suppliers from the first delivery."
- id: payment-runs
  section: Finance
  title: Payment runs and invoice approval
  owner: Accounts payable
  updated: "2026-08-14"
  tags: [payment run, invoice, approval, purchase order, PO, three-way match, dispute, payables, AP, open items]
  body:
    - "Payment runs are on Tuesday and Friday. Invoices need a matching purchase order and goods receipt (three-way match); anything else goes to the budget holder for approval in the workflow."
    - "Disputed invoices are put on hold with a reason code and the buyer is told the same day. Open items over 60 days are reviewed at the month-end close."
- id: expenses
  section: Finance
  title: Travel and expense policy
  owner: Group finance
  updated: "2026-03-02"
  tags: [expenses, travel, mileage, receipts, claims, reimbursement, per diem, lunch]
  body:
    - "Claim within 30 days with receipts. Mileage is paid at EUR 0.23 per km. Train travel second class; flights need director approval. Client lunches up to EUR 40 per person."
- id: holiday-entitlement
  section: HR
  title: Holiday entitlement and leave
  owner: HR
  updated: "2026-01-05"
  popular: true
  tags: [holiday, vacation, leave, annual leave, statutory, entitlement, days off, Dutch labour law, collective agreement, CAO, carry over, expiry, office move]
  body:
    - "Dutch law gives every employee statutory holiday of four times the weekly working hours a year: 20 days for a full-time 5-day week. Our collective agreement adds 5 non-statutory days, so a full-timer has 25 days."
    - "Statutory days not taken expire six months after the end of the year they were earned in; non-statutory days expire after five years. Request leave in the HR portal at least two weeks ahead; your manager approves."
    - "During the office consolidation, leave in the move week is only refused for the move team. Ask HR about special leave (moving house, family events)."
- id: sick-leave
  section: HR
  title: Reporting sick
  owner: HR
  updated: "2025-11-18"
  tags: [sick, illness, absence, reporting, occupational health, doctor, recovery]
  body:
    - "Call your manager before 09:00 on the first day, and again when you are better. Do not send a message only. After a week the occupational health service gets in touch."
- id: office-move
  section: Facilities
  title: "Office consolidation: moving from two floors to one"
  owner: Facilities
  updated: "2026-10-22"
  popular: true
  tags: [office move, consolidation, floor, desks, desk allocation, badges, access, seating plan, moving boxes, IT equipment]
  body:
    - "Head office moves from the second and third floors to the third floor only. Teams pack their desks into the labelled crates the Friday before their move date; IT moves the PCs and phones over the weekend."
    - "Desks are allocated by team zone, not personally. Badge access for the new floor is set up by facilities with IT; request changes through the service desk with the colleague's name and team."
    - "Meeting rooms on the second floor close after the move. Book the new rooms in Outlook as usual."
- id: badge-access
  section: Facilities
  title: Badges, building access and visitors
  owner: Facilities
  updated: "2026-06-10"
  tags: [badge, access card, building access, visitors, reception, lost badge, plant access]
  body:
    - "Badges are requested by the manager through the service desk. A lost badge is blocked the same day; collect a new one at reception. Visitors sign in at reception and are accompanied at all times in the plant."
- id: forklift-check
  section: Warehouse and plant
  title: Forklift daily pre-use check
  owner: Warehouse
  updated: "2026-10-01"
  popular: true
  tags: [forklift, reach truck, pre-use check, daily check, checklist, safety, fleet, refresh, inspection, drivers, defect]
  body:
    - "Every shift, before first use: forks and carriage for cracks and wear, chains and mast, tyres, hydraulic leaks, battery charge and connector, horn, lights and beacon, brakes and parking brake, seat belt, steering, and the data plate is readable."
    - "Record the check on the truck's card. A defect that affects safety takes the truck out of use: tag it and report it to the shift lead; do not drive it."
    - "Annual fleet safety refresh: all drivers repeat the practical assessment this autumn. The schedule is on the warehouse notice board."
- id: dock-schedule
  section: Warehouse and plant
  title: Dock slots and late deliveries
  owner: Warehouse
  updated: "2026-10-15"
  tags: [dock, slots, deliveries, late, inbound, outbound, pallets, unloading, haulier, schedule, shift]
  body:
    - "Inbound deliveries are booked in 30-minute dock slots, docks 1-3 for board reels and pallets, dock 4 for outbound. A haulier more than 30 minutes late loses the slot and is fitted in when a dock is free."
    - "Repeated late arrivals on a dock are raised with the plant manager with the dates and the haulier, so the slot times can be changed."
- id: shipment-tracking
  section: Warehouse and plant
  title: Tracking outbound shipments and pallets
  owner: Customer service
  updated: "2026-09-08"
  tags: [tracking, shipment, pallets, carrier, freight, DHL, haulier, delivery status, proof of delivery, customer order]
  body:
    - "Our carriers report pickups and proof of delivery into the order system each evening. For a shipment that left today, ask the warehouse shift lead for the loading list; for older ones, check the order's delivery tab."
    - "If a customer reports a missing delivery, open a carrier claim within 7 days with the order number, pallet count and pickup date."
- id: customer-orders
  section: Sales and customer service
  title: Answering a customer about order status
  owner: Customer service
  updated: "2026-07-21"
  tags: [customer, order status, orders, delivery date, planning, production, call back, complaint]
  body:
    - "Check the order in the order system first, then the production plan for its board date. Give the customer a date only once planning has confirmed it; call back the same day even if the answer is not ready."
- id: complaints
  section: Sales and customer service
  title: Quality complaints procedure
  owner: Quality
  updated: "2026-05-12"
  tags: [complaint, quality, defect, return, credit note, root cause, corrective action]
  body:
    - "Log the complaint with photos and the batch number. Quality replies within two working days with a first assessment; credit notes need the sales manager's approval."
- id: board-grades
  section: Procurement
  title: Corrugated board grades and equivalents
  owner: Procurement
  updated: "2026-10-18"
  popular: true
  tags: [board, grades, kraftliner, kraft, testliner, fluting, gsm, grammage, liner, corrugated, equivalent, spec, specification, reel widths, supplier switch]
  body:
    - "Liners we buy: kraftliner (virgin fibre, strongest, for wet and heavy loads) and testliner (recycled). Common grammages: 125, 150 and 175 gsm. Fluting: 100-140 gsm semi-chemical or recycled."
    - "Equivalents when switching supplier: compare grammage, burst strength and SCT/ECT values, not only the grade name. A 150 gsm kraftliner from a new mill is accepted after a trial run on line 2 and quality's sign-off."
    - "Standard reel widths are 1,800, 2,100 and 2,500 mm. Confirm widths with planning before the first order."
- id: board-market
  section: Procurement
  title: Board and paper market notes (monthly)
  owner: Procurement
  updated: "2026-10-28"
  tags: [kraftliner, price, prices, market, news, paper, recycled fibre, OCC, index, November, trend, cost]
  body:
    - "October: kraftliner prices steady, recycled testliner up slightly on higher recovered-paper costs. Mills have announced increases for January that are not yet confirmed."
    - "Procurement's view: fix first deliveries with the new supplier at the October price for November-December, and review in December."
- id: supplier-switch
  section: Procurement
  title: Switching primary board supplier
  owner: Procurement
  updated: "2026-10-24"
  tags: [supplier, switch, change, new supplier, first deliveries, delivery dates, purchase orders, trial, contract]
  body:
    - "The first deliveries from the new primary board supplier start on 3 November. Procurement agrees the delivery dates and dock slots with the warehouse and gives accounts payable the purchase order numbers before the first invoices arrive."
    - "Planning runs a trial on line 2 with the first reels; quality signs off the grades before full production."
- id: erp-migration
  section: IT
  title: ERP finance module migration FAQ
  owner: IT
  updated: "2026-10-26"
  popular: true
  tags: [ERP, cloud, finance module, migration, cutover, role mapping, roles, access, permissions, error, error code, users, go-live]
  body:
    - "Cutover is planned after the October close. Finance users get their roles in the new module from the access list that IT and finance agree; nobody gets access that is not on the list."
    - "Role mapping errors: ROLE-404 means the role on the list does not exist in the new module (check the spelling against the role catalogue); ROLE-409 means two roles conflict on segregation of duties (send it to the financial controller); AUTH-401 at login means the account has not been synced yet."
    - "Report problems to the service desk with the error code, the user and a screenshot."
- id: service-desk
  section: IT
  title: IT service desk, passwords and printing
  owner: IT
  updated: "2026-04-03"
  tags: [IT, service desk, helpdesk, password, reset, printer, printing, laptop, VPN, Outlook, Teams, software]
  body:
    - "Service desk: extension 4400 or the service desk mailbox. Passwords expire every 90 days; reset at Ctrl+Alt+Del, Change a password. Printers are mapped by floor; after the move, pick the third-floor printer."
- id: meeting-rooms
  section: Facilities
  title: Booking meeting rooms
  owner: Facilities
  updated: "2026-10-22"
  tags: [meeting room, booking, Outlook, calendar, invite, room, Teams]
  body:
    - "Book rooms as a resource in the Outlook meeting invite. Release a booking you no longer need so others can use the room."
- id: catalogue-update
  section: Sales and customer service
  title: Q4 customer catalogue update
  owner: Sales
  updated: "2026-10-10"
  tags: [catalogue, catalog, products, prices, Q4, customers, boxes, packaging]
  body:
    - "The Q4 catalogue adds the recycled-board food trays and drops three discontinued box sizes. Prices follow the board cost review; sales sends the final PDF to customers in November."
- id: health-safety
  section: Warehouse and plant
  title: Health and safety in the plant
  owner: Health and safety
  updated: "2026-02-17"
  tags: [safety, PPE, hearing protection, safety shoes, incident, near miss, first aid, plant]
  body:
    - "Safety shoes and hearing protection are required past the yellow line. Report incidents and near misses the same shift in the safety log; first aiders are listed at each entrance."
