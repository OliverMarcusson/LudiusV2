syntax = "proto3";

package ludius.v1;

option csharp_namespace = "Ludius.V1";

message Rect {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
}

message Element {
  uint32 id = 1;
  string key = 2;
  string role = 3;
  string name = 4;
  string value = 5;
  bool enabled = 6;
  bool focused = 7;
  bool read_only = 8;
  bool password = 9;
  bool expanded = 10;
  bool selected = 11;
  Rect bounds = 12;
  repeated string actions = 13;
  string automation_id = 14;
  string class_name = 15;
  string framework_id = 16;
  string ancestor_path = 17;
  repeated string hints = 18;
  uint32 window = 19;
  bool keyboard_focusable = 20;
}

message Window {
  int64 handle = 1;
  string title = 2;
  string class_name = 3;
  string process_name = 4;
  uint32 pid = 5;
  string framework_id = 6;
  Rect bounds = 7;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    FOREGROUND = 1;
    OWNED = 2;
    POPUP = 3;
    SHELL = 4;
  }
  Kind kind = 8;
  bool modal = 9;
  bool unresponsive = 10;
  bool elevated_unreadable = 11;
  bool no_tree = 12;
}

message Snapshot {
  uint64 seq = 1;
  int64 guest_time_ms = 2;
  int32 screen_width = 3;
  int32 screen_height = 4;
  int32 dpi = 5;
  repeated Window windows = 6;
  repeated Element elements = 7;
  repeated string context = 8;
  bool settled = 9;
  uint32 settle_ms = 10;
  bool busy_cursor = 11;
  bool indeterminate_progress = 12;
  bool locked = 13;
  int32 cursor_x = 14;
  int32 cursor_y = 15;
  uint32 dropped_elements = 16;
  string user = 17;
  repeated Window apps = 18;
  bool secure_desktop = 19;
}

message ObserverRequest {
  uint64 id = 1;
  oneof body {
    SnapshotRequest snapshot = 2;
    Ping ping = 3;
    ReadFile read_file = 4;
  }
}

message ReadFile {
  string path = 1;
  uint32 max_bytes = 2;
}

message FileContent {
  bool exists = 1;
  int64 written_ms = 2;
  bytes data = 3;
}

message SnapshotRequest {
  uint32 quiet_ms = 1;
  uint32 timeout_ms = 2;
  bool wait_settle = 3;
}

message Ping {}

message Hello {
  string version = 1;
  string user = 2;
  uint32 session_id = 3;
  bool ui_access = 4;
  bool pixel_settle = 5;
  string computer = 6;
}

message ObserverResponse {
  uint64 id = 1;
  oneof body {
    Hello hello = 2;
    Snapshot snapshot = 3;
    string error = 4;
    FileContent file = 5;
  }
}
