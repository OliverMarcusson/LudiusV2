---
# eventlogs: large enough that a scenario's events survive a day of noise (Sysmon's log: not installed yet).
- name: Event log sizes
  community.windows.win_eventlog:
    name: "{{ item.name }}"
    maximum_size: "{{ item.size }}"
  loop:
    - { name: Security, size: 1024MB }
    - { name: System, size: 256MB }
    - { name: Application, size: 256MB }
