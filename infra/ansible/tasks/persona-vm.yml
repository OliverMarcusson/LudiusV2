---
- name: Linked clone into the range pool, ludius-{{ p.user }}
  ansible.builtin.command: qm clone {{ template_vmid }} {{ p.vmid }} --name ludius-{{ p.user }} --pool {{ range_pool }}
  when: (p.vmid | int) not in pve_vms
  changed_when: true

- name: Range NIC only, vsock device, fixed display, size, asserted before every start
  ansible.builtin.include_tasks: range-nic-only.yml
  vars:
    nic_vmid: "{{ p.vmid }}"
    nic_extra: [--args, "-device vhost-vsock-pci,guest-cid={{ p.vmid }} {{ display_args }}", --vga, std, --tablet, "1",
                --cores, "{{ persona_cores }}", --memory, "{{ persona_memory_mb }}", --onboot, "1"]

- name: Wired for the guest channel, fixed display, expected name
  ansible.builtin.assert:
    that:
      - nic_cfg.args | default('') is search('vhost-vsock-pci,guest-cid=' ~ p.vmid ~ '( |$)')
      - nic_cfg.args | default('') is search('VGA.xres=1920') and nic_cfg.args | default('') is search('VGA.yres=1080')
      - nic_cfg.name == 'ludius-' ~ p.user
    fail_msg: >-
      ludius-{{ p.user }} ({{ p.vmid }}) lacks vsock CID {{ p.vmid }} or the fixed display in its running config
      (pending changes on a running VM?); shut it down (qm shutdown {{ p.vmid }}) and rerun

- name: Start the clone, ludius-{{ p.user }}
  ansible.builtin.command: qm start {{ p.vmid }}
  register: start
  changed_when: start.rc == 0
  failed_when: start.rc != 0 and 'already running' not in start.stderr

- name: Mark the clone for teardown, ludius-{{ p.user }}
  ansible.builtin.set_fact:
    bootstrapped: "{{ (bootstrapped | default([])) + [p.vmid] }}"

- name: Range address, bring-up admin and WinRM through the guest agent
  ansible.builtin.command:
    argv: [qm, guest, exec, "{{ p.vmid }}", --pass-stdin, "1", --timeout, "120", --, powershell.exe, -NoProfile,
           -NonInteractive, -EncodedCommand, "{{ lookup('ansible.builtin.template', 'bootstrap.ps1.j2') | b64encode(encoding='utf-16-le') }}"]
    stdin: "{{ range_admin_password }}"
  vars:
    ip: "{{ p.ip }}"
  register: boot
  until: boot.rc == 0 and (boot.stdout | from_json).exitcode | default(1) == 0
  retries: 60
  delay: 20
  changed_when: true
  no_log: true

- name: Persona in the inventory
  ansible.builtin.add_host:
    name: ludius-{{ p.user }}
    groups: personas
    ansible_host: "{{ p.ip }}"
    persona: "{{ p.user }}"
    computer_name: WS-{{ p.user | upper }}01
    ansible_user: "{{ range_admin_user }}"
    ansible_password: "{{ range_admin_password }}"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_port: 5985
  no_log: true
