name: ludius

services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    security_opt: ["apparmor=unconfined"]
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in .env}
      LUDIUS_DB_PASSWORD: ${LUDIUS_DB_PASSWORD:?set LUDIUS_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${LUDIUS_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U temporal -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  temporal-setup:
    image: temporalio/admin-tools:1.32.1@sha256:9ef0dc5b063bf4ffd5c1512de72e0e73e225bd2c7006a18ce69bd592a8862a83
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    environment:
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        t="temporal-sql-tool --plugin postgres12 --ep postgres -p 5432 -u temporal"
        for db in temporal temporal_visibility; do
          $$t --db $$db create
          $$t --db $$db setup-schema -v 0.0
          $$t --db $$db update-schema -d /etc/temporal/schema/postgresql/v12/$${db#temporal_}/versioned
        done

  temporal:
    image: temporalio/server:1.32.1@sha256:acecbab5b0b8ae9cf4012b508866ca97feda3709577bf157b537239f40029049
    restart: unless-stopped
    depends_on:
      temporal-setup: {condition: service_completed_successfully}
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in .env}
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
    volumes:
      - ./dynamicconfig/docker.yaml:/etc/temporal/config/dynamicconfig/docker.yaml:ro
    ports:
      - "127.0.0.1:${LUDIUS_TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  temporal-namespace:
    image: temporalio/admin-tools:1.32.1@sha256:9ef0dc5b063bf4ffd5c1512de72e0e73e225bd2c7006a18ce69bd592a8862a83
    depends_on:
      temporal: {condition: service_healthy}
    restart: "on-failure:5"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        a="--address temporal:7233"
        temporal operator cluster health $$a
        temporal operator namespace describe -n default $$a >/dev/null 2>&1 || temporal operator namespace create -n default $$a

  host-agent:
    image: ${LUDIUS_HOST_AGENT_IMAGE:?set LUDIUS_HOST_AGENT_IMAGE in .env}
    restart: unless-stopped
    network_mode: host  # pveproxy listens on 127.0.0.1 only
    security_opt: ["apparmor=unconfined"]  # the default profile denies unix sockets (QMP, signals), as for postgres
    environment:
      PVE_NODE: ${PVE_NODE:?set PVE_NODE in .env}
      PVE_POOL: ${PVE_POOL:?set PVE_POOL in .env}
      PVE_CAP_EXEMPT: ${PVE_CAP_EXEMPT:-}
      AGENT_MAX_RUNNING: ${AGENT_MAX_RUNNING:-1}
      AGENT_LISTEN: ${AGENT_LISTEN:-127.0.0.1:7451}
      PVE_TOKEN_FILE: /run/secrets/pve_token
      PVE_ROOT_PASSWORD_FILE: /run/secrets/pve_root_password
      AGENT_SCRATCH_DIR: /var/lib/ludius/agent-scratch
    volumes:
      - /var/run/qemu-server:/var/run/qemu-server  # QMP sockets
      - /var/lib/ludius/agent-scratch:/var/lib/ludius/agent-scratch  # QEMU writes screendumps here: same path on both sides
      - /etc/pve/pve-root-ca.pem:/etc/pve/pve-root-ca.pem:ro  # only the CA, not /etc/pve/priv
    secrets: [pve_token, pve_root_password]

  monitor:
    image: ${LUDIUS_MONITOR_IMAGE:?set LUDIUS_MONITOR_IMAGE in .env}
    restart: unless-stopped
    network_mode: host  # Caddy proxies 127.0.0.1:7452; the host agent is on 127.0.0.1:7451
    environment:
      MONITOR_LISTEN: ${MONITOR_LISTEN:-127.0.0.1:7452}
      LUDIUS_AGENT: http://${AGENT_LISTEN:-127.0.0.1:7451}
      MONITOR_ALLOWED_ORIGINS: ${MONITOR_ALLOWED_ORIGINS:-}
      MONITOR_ALLOWED_HOSTS: ${MONITOR_ALLOWED_HOSTS:-127.0.0.1;localhost}
      LUDIUS_RUNS: /var/lib/ludius/runs
      LUDIUS_DATA: /etc/ludius/data
    volumes:
      - ${LUDIUS_RUNS_DIR:?set LUDIUS_RUNS_DIR in .env}:/var/lib/ludius/runs  # read-only except runs/portraits
      - ${LUDIUS_DATA_DIR:?set LUDIUS_DATA_DIR in .env}:/etc/ludius/data:ro  # controller/data: personas, templates
      - /etc/localtime:/etc/localtime:ro  # the warp journal writes naive local times

secrets:
  pve_token:
    file: ${LUDIUS_SECRETS:-./secrets}/pve_token
  pve_root_password:
    file: ${LUDIUS_SECRETS:-./secrets}/pve_root_password

volumes:
  pgdata:
