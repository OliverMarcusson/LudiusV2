---
# Golden Windows 10 image (spec section 7), applied by Packer over WinRM to the freshly installed build VM.
# Persona-specific roles (domain, ux_noise, the observer's logon task) run per clone in range-up.yml.
# sysprep only stages the answer file; Packer's last provisioner generalizes.
- name: Golden image
  hosts: all
  gather_facts: false
  # Packer connects as soon as the first-logon commands have WinRM listening. The first module call of a build was
  # seen to hang there for good (its PowerShell bootstrap never got its input; the same call later took seconds), and
  # nothing bounds a module call over WinRM: a short timeout with retries gets past it.
  pre_tasks:
    - name: WinRM answers a module call
      ansible.windows.win_ping:
      timeout: 120
      register: ping
      retries: 5
      delay: 10
      until: ping is succeeded
  roles:
    - base
    - eventlogs
    - hypervisor
    - apps
    - accessibility
    - observer
    - sysprep
