---
# Golden Windows 10 image (spec section 7), applied by Packer over WinRM to the freshly installed build VM.
# Persona-specific roles (domain, ux_noise, the observer's logon task) run per clone in range-up.yml.
# sysprep only stages the answer file; Packer's last provisioner generalizes.
- name: Golden image
  hosts: all
  gather_facts: false
  # Packer connects as soon as the first-logon commands have WinRM listening, while the fresh guest is still busy. The
  # first module call is bounded so a stalled WinRM exchange fails the build in minutes, not hours (the stall itself:
  # Packer's ansible provisioner, WinRM timeouts).
  pre_tasks:
    - name: WinRM answers a module call
      ansible.windows.win_ping:
      timeout: 300
  roles:
    - base
    - eventlogs
    - hypervisor
    - apps
    - accessibility
    - observer
    - sysprep
