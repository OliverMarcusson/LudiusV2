# Write a short note in Notepad and save it in Documents.
# Variants cover launch method (Start search vs Run: different parent process,
# UserAssist and RunMRU artifacts) and UI path (Ctrl+S vs File menu).
task: notepad_write_note
app: notepad
processes: [notepad.exe]
params: [file_name, body]
about: "Write a short plain-text note in Notepad and save it to Documents. file_name: without extension; body: the note text (ASCII, several lines)."
defaults: {launch_query: notepad}
example: {file_name: admission test note, body: "admission test\nsecond line"}
variants:
  - [open_from_start, write_body, save_shortcut, name_file, confirm_save, close_app]
  - [open_from_run, write_body, save_menu, name_file, confirm_save, close_app]
  - [open_from_start, write_body, save_menu, name_file, confirm_save, close_app]
  # Mistake: a stray key at the end of the file name, removed with Backspace before saving.
  - [open_from_run, write_body, save_shortcut, name_file_typo, fix_file_name, confirm_save, close_app]
weights: [1, 1, 1, 0.5]
budget_steps: 40
budget_minutes: 8
on_abandon: close_without_saving
subgoals:
  open_from_start:
    goal: "Open Notepad by searching for it in the Start menu"
    launch: true
    keys: [Win]
    text: launch_query
    done: {foreground: {process: notepad.exe}}
  open_from_run:
    goal: "Open Notepad through the Run dialog (Win+R)"
    launch: true
    keys: [Win+R]
    text: launch_query
    done: {foreground: {process: notepad.exe}}
  write_body:
    goal: "Type the note into the Notepad text area"
    text: body
    done: {typed: true}
  save_shortcut:
    goal: "Open the Save As dialog with the keyboard shortcut"
    keys: [Ctrl+S]
    done: {window: {process: notepad.exe, title: "^Save As$"}}
  save_menu:
    goal: "Open the Save As dialog from Notepad's File menu"
    done: {window: {process: notepad.exe, title: "^Save As$"}}
  name_file:
    goal: "Enter {file_name} as the file name in the Save As dialog"
    text: file_name
    done: {typed: true, element: {name: "^File name", value: '^{file_name}(\.txt)?$'}}
  name_file_typo:
    goal: "Enter {file_name_typo} as the file name in the Save As dialog"
    text: file_name_typo
    done: {typed: true, element: {name: "^File name", value: '^{file_name_typo}$'}}
  fix_file_name:
    goal: "The file name ends with a stray character; press Backspace once so it reads {file_name}"
    keys: [Backspace]
    done: {element: {name: "^File name", value: '^{file_name}(\.txt)?$'}}
  confirm_save:
    goal: "Save the file as {file_name}"
    # Explorer hides known extensions by default, so the title may lack ".txt".
    done: {window: {process: notepad.exe, title: '^{file_name}(\.txt)? - Notepad$'}}
  close_app:
    goal: "Close Notepad"
    done: {window: {process: notepad.exe, absent: true}}
# Pixels-only mode (agreed with Mochi). Values come from real OCR on the recorded fixtures
# (runs/visual/20261026-222911-pixels-anchor-inputs.txt): desktop and Start out of scope, all three Notepad
# screens in. Matching ignores case and whitespace. confirm_save is from a real saved title on the guest
# (runs/visual/20261026-223919-saved-title.txt): OCR reads Notepad's title icon as a leading glyph
# ("I pixels-title-... - Notepad"), so up to two characters may precede the file name.
# write_body: the body's first line ({body_head}: its first 24 characters) as its own row, as typed text reads on
# the guest (runs/visual/20261026-230211-pixels-walk.txt: 'pixels walk'@221,261). The unsaved star only supplements
# it, since any edit sets it. This proves a visible prefix of the body, not that the whole body landed intact.
# File name rows: the field's value reads as its own row beside 'File name:' (same walk: the typed path
# 'C:\Users\aberg\Documents\pixels-walk-...'@352,683; '*.txt' before typing). A same-named file listed in the
# folder would also match; the saved-title check of confirm_save still fails closed then.
pixels:
  title: '-Notepad$'
  anchors: ['^FileEditFormatView|Doyouwanttosavechanges']
  done:
    open_from_start: {present: ['-Notepad$']}
    open_from_run: {present: ['-Notepad$']}
    write_body: {present: ['^{body_head}', '^.{0,2}\*.*-Notepad$']}
    save_shortcut: {present: ['^SaveAs$', '^Filename:', '^Saveastype:']}
    save_menu: {present: ['^SaveAs$', '^Filename:', '^Saveastype:']}
    name_file: {present: ['^Filename:', '(^|\\){file_name}(\.txt)?$']}
    name_file_typo: {present: ['^Filename:', '(^|\\){file_name_typo}$']}
    fix_file_name: {present: ['^Filename:', '(^|\\){file_name}(\.txt)?$'], absent: ['(^|\\){file_name_typo}$']}
    confirm_save: {present: ['^.{0,2}{file_name}(\.txt)?-Notepad$']}
    close_app: {absent: ['-Notepad$'], present: ['ypeheretosearch|RecycleBin']}
  hints:
    write_body: "If nothing else was clicked since Notepad opened, try typing at the keyboard focus."
