---
- name: Packages
  ansible.builtin.apt:
    name: [postgresql, nginx, chrony, python3, curl, openssl]
    update_cache: true

- name: Clock follows the range time source at srv01_ip, stepping any offset (the range clock jumps)
  ansible.builtin.copy:
    dest: /etc/chrony/chrony.conf
    mode: "0644"
    content: |
      server {{ srv01_ip }} iburst minpoll 4 maxpoll 6
      makestep 1 -1
      maxdistance 16
      driftfile /var/lib/chrony/chrony.drift
  register: chrony_conf

- name: Chrony restarted
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted
    enabled: true
  when: chrony_conf is changed

- name: Mattermost account
  ansible.builtin.user:
    name: mattermost
    system: true
    home: /opt/mattermost
    create_home: false
    shell: /usr/sbin/nologin

- name: Mattermost database (peer auth over the socket, as the mattermost account)
  ansible.builtin.shell: |
    set -eu
    q() { runuser -u postgres -- psql -tAc "$1"; }
    [ "$(q "select 1 from pg_roles where rolname = 'mattermost'")" = 1 ] || { runuser -u postgres -- createuser mattermost; echo changed; }
    [ "$(q "select 1 from pg_database where datname = 'mattermost'")" = 1 ] || { runuser -u postgres -- createdb -O mattermost mattermost; echo changed; }
  args:
    chdir: /
  register: db
  changed_when: "'changed' in db.stdout"

- name: Mattermost release, checked
  ansible.builtin.get_url:
    url: "{{ mattermost_url }}"
    dest: /opt/{{ mattermost_url | basename }}
    checksum: sha256:{{ mattermost_sha256 }}
    mode: "0644"

- name: Mattermost unpacked
  ansible.builtin.unarchive:
    src: /opt/{{ mattermost_url | basename }}
    dest: /opt
    remote_src: true
    owner: mattermost
    group: mattermost
    creates: /opt/mattermost/bin/mattermost

- name: Mattermost data folder
  ansible.builtin.file:
    path: /opt/mattermost/data
    state: directory
    owner: mattermost
    group: mattermost
    mode: "0750"

- name: SSO secret folder
  ansible.builtin.file:
    path: /etc/ludius-chat
    state: directory
    mode: "0755"

- name: SSO client secret (made once)
  ansible.builtin.shell: umask 077 && openssl rand -hex 32 > /etc/ludius-chat/sso-secret
  args:
    creates: /etc/ludius-chat/sso-secret

- name: SSO client secret read
  ansible.builtin.slurp:
    src: /etc/ludius-chat/sso-secret
  register: sso_secret

- name: Mattermost settings
  ansible.builtin.template:
    src: mattermost.env.j2
    dest: /etc/mattermost.env
    mode: "0600"
  vars:
    chat_sso_secret: "{{ sso_secret.content | b64decode | trim }}"
  no_log: true
  register: mm_env

- name: Mattermost service
  ansible.builtin.copy:
    dest: /etc/systemd/system/mattermost.service
    mode: "0644"
    content: |
      [Unit]
      Description=Mattermost
      After=network.target postgresql.service
      Requires=postgresql.service

      [Service]
      Type=notify
      ExecStart=/opt/mattermost/bin/mattermost
      EnvironmentFile=/etc/mattermost.env
      WorkingDirectory=/opt/mattermost
      User=mattermost
      Group=mattermost
      TimeoutStartSec=600
      KillMode=mixed
      Restart=always
      RestartSec=10
      LimitNOFILE=49152

      [Install]
      WantedBy=multi-user.target
  register: mm_unit

- name: Narrative people for the SSO shim (account -> id, address, name)
  ansible.builtin.copy:
    dest: /etc/ludius-chat/users.json
    mode: "0644"
    content: |
      {
      {% for p in people %}
        {{ p.user | to_json }}: {"id": {{ (p.user | hash('sha1'))[:12] | int(base=16) }}, "email": {{ (p.user ~ '@' ~ mail_domain) | to_json }}, "name": {{ p.name | to_json }}}{{ '' if loop.last else ',' }}
      {% endfor %}
      }
  register: sso_users

- name: SSO shim
  ansible.builtin.copy:
    src: chat-sso.py
    dest: /usr/local/lib/chat-sso.py
    mode: "0755"
  register: sso_code

- name: Chat-post (the controller posts as a manager, who has no VM, over SSH)
  ansible.builtin.copy:
    src: chat-post.py
    dest: /usr/local/sbin/chat-post
    mode: "0755"

- name: SSO shim service (loopback only, no privileges)
  ansible.builtin.copy:
    dest: /etc/systemd/system/chat-sso.service
    mode: "0644"
    content: |
      [Unit]
      Description=Ludius chat SSO (client certificate via nginx -> GitLab-style OAuth for Mattermost)

      [Service]
      ExecStart=/usr/bin/python3 /usr/local/lib/chat-sso.py
      Environment=CLIENT_ID=ludius-chat USERS=/etc/ludius-chat/users.json
      Environment=REDIRECT=https://{{ chat_host }}/signup/gitlab/complete
      LoadCredential=secret:/etc/ludius-chat/sso-secret
      DynamicUser=true
      Restart=always

      [Install]
      WantedBy=multi-user.target
  register: sso_unit

- name: Services up (restarted on a change)
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    state: "{{ 'restarted' if item.changed else 'started' }}"
    enabled: true
    daemon_reload: true
  loop:
    - { name: chat-sso, changed: "{{ sso_users is changed or sso_code is changed or sso_unit is changed }}" }
    - { name: mattermost, changed: "{{ mm_env is changed or mm_unit is changed }}" }
  loop_control:
    label: "{{ item.name }}"

- name: No Kerberos keytab left (sign-in is by client certificate)
  ansible.builtin.file:
    path: /etc/nginx/chat.keytab
    state: absent

- name: Chat CA, server certificate and one client certificate per person (made once, keys stay here)
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077; mkdir -p /etc/ludius-chat/pki/clients; cd /etc/ludius-chat/pki
    sign() { local f=$1; shift; openssl x509 -req -in "$f.csr" -CA ca.crt -CAkey ca.key -CAcreateserial -days 3650 -out "$f.crt" -extfile <(printf '%s\n' "$@" basicConstraints=CA:false); }
    [ -f ca.crt ] || { openssl req -x509 -newkey rsa:3072 -nodes -keyout ca.key -out ca.crt -days 3650 -subj "/CN=Ludius chat CA" \
      -addext basicConstraints=critical,CA:true -addext keyUsage=critical,keyCertSign,cRLSign; rm -f server.crt clients/*; echo changed; }
    [ -f server.crt ] || { openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN={{ chat_host }}"
      sign server subjectAltName=DNS:{{ chat_host }} extendedKeyUsage=serverAuth; echo changed; }
    for u in {{ people | map(attribute='user') | join(' ') }}; do
      [ -f "clients/$u.p12" ] && continue
      openssl req -newkey rsa:2048 -nodes -keyout "clients/$u.key" -out "clients/$u.csr" -subj "/CN=$u"
      sign "clients/$u" extendedKeyUsage=clientAuth
      # 3DES and SHA1, so the PFX import of Windows 10 reads it
      openssl pkcs12 -export -in "clients/$u.crt" -inkey "clients/$u.key" -out "clients/$u.p12" -passout pass: \
        -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
      echo changed
    done
  args:
    executable: /bin/bash
  register: pki
  changed_when: "'changed' in pki.stdout"

- name: Chat CA and the personas' client certificates to the control node (personas trust and present them)
  ansible.builtin.fetch:
    src: /etc/ludius-chat/pki/{{ item }}
    dest: "{{ chat_pki_dir }}/{{ item | basename }}"
    flat: true
  loop: "{{ ['ca.crt'] + range_personas | map(attribute='user') | map('regex_replace', '^', 'clients/') | map('regex_replace', '$', '.p12') | list }}"

- name: Nginx site
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default
    mode: "0644"
  register: site

- name: Nginx config valid, reloaded on a change
  ansible.builtin.shell: nginx -t && systemctl reload-or-restart nginx
  when: pki is changed or site is changed
  changed_when: true

- name: Setup script
  ansible.builtin.template:
    src: chat-setup.sh.j2
    dest: /usr/local/sbin/chat-setup
    mode: "0755"
  vars:
    chat: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../data/chat.yaml') | from_yaml }}"

- name: Team, channels and users (SSO only)
  ansible.builtin.command: /usr/local/sbin/chat-setup
  register: setup
  changed_when: "'changed' in setup.stdout"

- name: Checks (Mattermost through nginx, sign-in page offers only SSO, no password sign-in, a client certificate required and accepted)
  ansible.builtin.shell: |
    set -euo pipefail
    pki=/etc/ludius-chat/pki; at=(--resolve {{ chat_host }}:443:127.0.0.1 --cacert $pki/ca.crt)
    c=$(curl -s "${at[@]}" 'https://{{ chat_host }}/api/v4/config/client?format=old')
    echo "$c" | python3 -c 'import json,sys; c=json.load(sys.stdin); sys.exit(not (c["EnableSignUpWithGitLab"] == "true" and c["EnableSignInWithEmail"] == "false" and c["EnableSignInWithUsername"] == "false"))'
    test "$(curl -s -o /dev/null -w '%{http_code}' "${at[@]}" https://{{ chat_host }}/oauth/authorize)" = 401
    # a valid certificate gets past nginx: the shim answers (403 without a client_id), not nginx's 401
    u={{ people[0].user }}
    test "$(curl -s -o /dev/null -w '%{http_code}' "${at[@]}" --cert $pki/clients/$u.crt --key $pki/clients/$u.key https://{{ chat_host }}/oauth/authorize)" = 403
    chronyc -n sources | grep -q '^\^\*'
  args:
    executable: /bin/bash
  register: chat_checks
  retries: 20
  delay: 15
  until: chat_checks is succeeded
  changed_when: false
