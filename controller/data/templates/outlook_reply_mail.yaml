# Reply in Outlook (classic) to a colleague's real mail in the Inbox, found by its subject.
# The mail and the reply text are chosen at task time (capability mail.reply, ludius.reply): the newest unanswered
# mail from the planned colleague, read on the range server; one LLM call writes the reply to its text, code and a
# Decisions yes/no check validate it, and the recipient is that mail's sender. Done is checked on the range server, not
# in the UI (ludius.mail): an "RE:" message answering that mail (In-Reply-To = its message id) in the sender's
# inbox and the persona's Sent Items, with the typed text above the quote. Variants: Ctrl+R vs the Reply button.
task: outlook_reply_mail
app: outlook
capability: mail.reply  # the shared send contract on the profile's mail form (data/apps/outlook.yaml, ludius.tasks.Form)
params: [to, to_name, subject]
about: "Reply in Outlook to a colleague's mail in the Inbox. to: the address of the colleague who sent it (<user>@ludius.internal); subject: that mail's exact subject without RE:, as listed in the inbox, or empty for their newest unanswered mail. The reply text is written when the task runs, from the mail itself."
defaults: {subject: ""}
example: {to: mvellinga@ludius.internal, to_name: Marcus Vellinga, subject: ""}
variants:
  - [open_outlook, open_message, reply_shortcut, write_reply, send_shortcut, close_message, close_outlook]
  - [open_outlook, open_message, reply_button, write_reply, send_shortcut, close_message, close_outlook]
budget_steps: 40
budget_minutes: 8
on_abandon: close_without_saving
subgoals:
  open_outlook:
    goal: "Open Outlook by searching for it in the Start menu"
    launch: true
    keys: [Win]
    text: launch_query
    steps: 8
    done: {foreground: {process: outlook.exe, title: "Outlook"}}
  open_message:
    goal: "In the Inbox, open the mail with the subject {subject} in its own window (double-click it)"
    keys: [Enter]
    done: {window: {process: outlook.exe, title: '^{subject}\s*-\s*Message'}}
  reply_shortcut:
    goal: "Reply to the open mail with Ctrl+R"
    keys: [Ctrl+R]
    done: {window: {process: outlook.exe, title: '^RE: {subject}\s*-\s*Message'}}
  reply_button:
    goal: "Reply to the open mail with the Reply button on its Message tab"
    done: {window: {process: outlook.exe, title: '^RE: {subject}\s*-\s*Message'}}
  write_reply:
    goal: "Type the reply at the top of the message body, above the quoted mail"
    text: body
    unreadable_ok: true  # Word body: no UIA value; the server-side body check decides
    caret: start  # a click lands anywhere, often in the quote: Ctrl+Home back to the top of the reply
    done: {typed: true}
  send_shortcut:
    goal: "Send the reply with Alt+S"
    keys: [send]
    allow_destructive: ["Send"]
    done: {mail: {mailbox: "{to}", above_quote: true, reply_to: "{reply_to}"}}
  close_message:
    goal: "Close the original mail's window"
    keys: [Esc]
    done: {window: {process: outlook.exe, title: '^{subject}\s*-\s*Message', absent: true}}
  close_outlook:
    goal: "Close Outlook"
    done: {window: {process: outlook.exe, absent: true}}
