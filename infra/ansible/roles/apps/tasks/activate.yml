---
- name: Activate Office against the range KMS host
  when: office_kms_host | length > 0
  ansible.windows.win_powershell:
    script: |
      param($kms, $gvlk)
      $ErrorActionPreference = 'Stop'
      $office = "ApplicationID='0ff1ce15-a989-479d-af46-f275c6370663' AND PartialProductKey IS NOT NULL"
      if (-not (Get-CimInstance SoftwareLicensingProduct -Filter $office)) {
        Invoke-CimMethod -InputObject (Get-CimInstance SoftwareLicensingService) -MethodName InstallProductKey -Arguments @{ ProductKey = $gvlk } | Out-Null
      }
      $h, $p = $kms -split ':', 2
      foreach ($o in Get-CimInstance SoftwareLicensingProduct -Filter $office) {
        Invoke-CimMethod -InputObject $o -MethodName SetKeyManagementServiceMachine -Arguments @{ MachineName = $h } | Out-Null
        if ($p) { Invoke-CimMethod -InputObject $o -MethodName SetKeyManagementServicePort -Arguments @{ PortNumber = [uint32]$p } | Out-Null }
        Invoke-CimMethod -InputObject $o -MethodName Activate | Out-Null
      }
      $bad = Get-CimInstance SoftwareLicensingProduct -Filter $office | Where-Object LicenseStatus -ne 1
      if ($bad) { throw "Office not licensed: $(($bad | ForEach-Object { "$($_.Name) status $($_.LicenseStatus)" }) -join '; ')" }
    parameters:
      kms: "{{ office_kms_host }}"
      gvlk: "{{ office_gvlk }}"
