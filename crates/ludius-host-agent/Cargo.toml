[package]
name = "ludius-host-agent"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
hyper = "1.12.0"
libc = "0.2.191"
ludius-proto = { version = "0.1.0", path = "../ludius-proto" }
prost = "0.14.4"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "query", "rustls"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-vsock = "0.7.2"
tonic = "0.14.9"
