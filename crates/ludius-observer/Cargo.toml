[package]
name = "ludius-observer"
version = "0.2.0"
edition.workspace = true
publish.workspace = true

# Neutral process name; listed in the instructors' known-infrastructure list.
[[bin]]
name = "uiprobe"
path = "src/main.rs"

[features]
# uiAccess=true manifest: needs a signature chaining to a trusted root and a Program Files install.
uiaccess = []
# Watchdog fault hooks for the VM smoke test (quiet_ms 4242 hangs, 4243 fails); never in a production build.
watchdog-test = []

[dependencies]
ludius-proto = { path = "../ludius-proto" }
prost = "0.14.4"
regex = "1.13.1"
sha1 = "0.10.6"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
