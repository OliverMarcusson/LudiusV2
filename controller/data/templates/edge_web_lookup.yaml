# Look something up on the company intranet in Edge and read one result (the closed range has no web: Edge's default
# search is the range intranet on dc01, set by GPO).
task: edge_web_lookup
app: edge
processes: [msedge.exe]
params: [search_query]
about: "Look something up on the company intranet in Edge (policies, procedures, supplier and product notes, IT help) and open one result. search_query: what the persona types into the search box."
defaults: {app_query: edge}
example: {search_query: weather in Lund tomorrow}
variants:
  - [open_edge_start, search, open_result, close_edge]
  - [open_edge_taskbar, search, open_result, close_edge]
budget_steps: 40
budget_minutes: 8
subgoals:
  open_edge_start:
    goal: "Open Microsoft Edge from the Start menu"
    launch: true
    keys: [Win]
    text: app_query
    done: {foreground: {process: msedge.exe}}
  open_edge_taskbar:
    goal: "Open Microsoft Edge from its taskbar button"
    launch: true
    done: {foreground: {process: msedge.exe}}
  search:
    goal: "Search the web for: {search_query}"
    text: search_query
    keys: [Ctrl+L, Enter]
    allow_destructive: ["(?i)accept.*|reject.*"]
    done: {foreground: {process: msedge.exe, title: "{search_query}"}}
  open_result:
    goal: "Open one of the search results that matches the search"
    allow_destructive: ["(?i)accept.*|reject.*"]
    steps: 10
    # An intranet article is in front (results often open in a new tab): its title ends "- Intranet page" (dc01 role,
    # intranet.html.j2); "not naming the query" failed whenever an article's title held a short query (ERP).
    done: {foreground: {process: msedge.exe, title: ' - Intranet page'}}
  close_edge:
    goal: "Close Microsoft Edge"
    done: {window: {process: msedge.exe, absent: true}}
