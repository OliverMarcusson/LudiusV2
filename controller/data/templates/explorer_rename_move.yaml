task: explorer_rename_move
app: explorer
capability: file.move
processes: [explorer.exe]
writes: ['Documents\{folder_name}\{new_name}.*']
removes: ['Documents\{file_name}.*']
params: [file_name, new_name, folder_name]
about: "Rename an existing file in Documents and move it into an existing folder there with Cut and Paste. file_name: the file's current name as Explorer shows it (no extension); new_name: its new name without extension; folder_name: an existing folder in Documents."
example: {file_name: admission test note, new_name: admission test note old, folder_name: admission test folder}
variants:
  - [open_explorer_keys, go_documents, rename_keys, move_keys, close_explorer]
  - [open_explorer_taskbar, go_documents, rename_menu, move_menu, close_explorer]
  - [open_explorer_keys, go_documents, rename_menu, move_keys, close_explorer]
budget_steps: 40
budget_minutes: 7
subgoals:
  open_explorer_keys:
    goal: "Open File Explorer with Win+E"
    launch: true
    keys: [Win+E]
    done: {foreground: {process: explorer.exe, class_name: CabinetWClass}}
  open_explorer_taskbar:
    goal: "Open File Explorer from its taskbar button"
    launch: true
    done: {foreground: {process: explorer.exe, class_name: CabinetWClass}}
  go_documents:
    goal: "Go to the Documents folder"
    done: {foreground: {process: explorer.exe, class_name: CabinetWClass, title: "^Documents$"}}
  rename_keys:
    goal: "Select the file {file_name}, press F2, type {new_name} and press Enter"
    text: new_name
    keys: [F2, Enter]
    done: {element: {role: list item, name: '^{new_name}(\.\w+)?$'}}
  rename_menu:
    goal: "Right-click the file {file_name}, choose Rename, type {new_name} and press Enter"
    text: new_name
    keys: [Enter]
    done: {element: {role: list item, name: '^{new_name}(\.\w+)?$'}}
  move_keys:
    goal: "Cut the file {new_name} with Ctrl+X, open the folder {folder_name} and paste it there with Ctrl+V"
    keys: [Ctrl+X, Ctrl+V]
    steps: 14
    done:
      foreground: {process: explorer.exe, class_name: CabinetWClass, title: '^{folder_name}$'}
      element: {role: list item, name: '^{new_name}(\.\w+)?$'}
  move_menu:
    goal: "Right-click the file {new_name} and choose Cut, open the folder {folder_name}, then right-click an empty area there and choose Paste"
    steps: 14
    done:
      foreground: {process: explorer.exe, class_name: CabinetWClass, title: '^{folder_name}$'}
      element: {role: list item, name: '^{new_name}(\.\w+)?$'}
  close_explorer:
    goal: "Close File Explorer"
    done: {window: {process: explorer.exe, class_name: CabinetWClass, absent: true}}
