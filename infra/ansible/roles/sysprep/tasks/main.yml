---
- name: Clones' answer file
  ansible.windows.win_copy:
    src: unattend.xml
    dest: C:\Windows\System32\Sysprep\ludius-unattend.xml

- name: No build admin autologon or stored password in the image
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
    name: "{{ item }}"
    state: absent
  loop: [DefaultPassword, AutoLogonCount]

- name: Autologon off
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
    name: AutoAdminLogon
    data: "0"
    type: string

- name: WinRM disabled from next boot
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\WinRM
    name: Start
    data: 4
    type: dword
