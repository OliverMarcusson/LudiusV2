---
- name: Defender feature removed
  ansible.windows.win_feature:
    name: Windows-Defender
    state: absent
  register: defender_feature

- name: Reboot for the Defender removal (bounded; ex01 until Exchange's services run)
  ansible.windows.win_reboot:
    reboot_timeout: 1200
    test_command: >-
      if ((Get-Service MSExchangeIS, MSExchangeTransport, MSExchangeFrontEndTransport -ErrorAction SilentlyContinue |
      Where-Object Status -ne Running)) { throw 'Exchange services not running yet' }
  when: defender_feature.reboot_required

- name: Defender gone (no WinDefend service, feature not installed)
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $f = (Get-WindowsFeature Windows-Defender).InstallState
      if (Get-Service WinDefend -ErrorAction SilentlyContinue) { throw "WinDefend still present (feature $f)" }
      if ("$f" -eq 'Installed') { throw 'Windows-Defender feature still installed' }
      $s = try { Get-MpComputerStatus -ErrorAction Stop; 'readable' } catch { 'unavailable' }
      if ($s -eq 'readable') { throw 'Get-MpComputerStatus still answers' }
      "WinDefend absent, feature $f, Get-MpComputerStatus $s"
  register: defender_off

- name: Defender state
  ansible.builtin.debug:
    var: defender_off.output
