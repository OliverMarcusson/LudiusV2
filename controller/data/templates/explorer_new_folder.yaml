task: explorer_new_folder
app: explorer
processes: [explorer.exe]
writes: ['Documents\{folder_name}']
params: [folder_name]
about: "Create a new folder in Documents with File Explorer. folder_name: the folder's name in the persona's naming habit."
example: {folder_name: admission test folder}
variants:
  - [open_explorer_keys, go_documents, new_folder_shortcut, name_folder, close_explorer]
  - [open_explorer_taskbar, go_documents, new_folder_button, name_folder, close_explorer]
  - [open_explorer_keys, go_documents, new_folder_shortcut, name_folder_typo, rename_folder, close_explorer]
weights: [1, 1, 0.3]
budget_steps: 35
budget_minutes: 6
subgoals:
  open_explorer_keys:
    goal: "Open File Explorer with Win+E"
    launch: true
    keys: [Win+E]
    done: {foreground: {process: explorer.exe, class_name: CabinetWClass}}
  open_explorer_taskbar:
    goal: "Open File Explorer from its taskbar button"
    launch: true
    done: {foreground: {process: explorer.exe, class_name: CabinetWClass}}
  go_documents:
    goal: "Go to the Documents folder"
    done: {foreground: {process: explorer.exe, class_name: CabinetWClass, title: "^Documents$"}}
  new_folder_shortcut:
    goal: "Create a new folder here with Ctrl+Shift+N"
    keys: [Ctrl+Shift+N]
    done: {element: {role: edit, name: '^New folder'}}
  new_folder_button:
    goal: "Create a new folder here with the New folder button"
    done: {element: {role: edit, name: '^New folder'}}
  name_folder:
    goal: "Name the new folder {folder_name} and confirm the name"
    text: folder_name
    keys: [Enter]
    done: {element: {role: list item, name: '^{folder_name}$'}}
  name_folder_typo:
    goal: "Name the new folder {folder_name_typo} and confirm the name"
    text: folder_name_typo
    keys: [Enter]
    done: {element: {role: list item, name: '^{folder_name_typo}$'}}
  rename_folder:
    goal: "Rename the folder {folder_name_typo} to {folder_name}: select it, press F2, type the name, press Enter"
    text: folder_name
    keys: [F2, Enter]
    done: {element: {role: list item, name: '^{folder_name}$'}}
  close_explorer:
    goal: "Close File Explorer"
    done: {window: {process: explorer.exe, class_name: CabinetWClass, absent: true}}
